<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>在庫・賞味期限管理 Ver.2</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header"><div><strong>在庫・賞味期限管理</strong><small>Ver.2 開発版 / 端末内保存</small></div><button id="settingsBtn" class="secondary">設定</button></header>
<main id="app">
<section id="setupView" class="view hidden"><div class="card"><h1>初期設定</h1><p>この端末で使用する店舗名を登録します。</p><label>店舗名<input id="storeNameInput" maxlength="80" autocomplete="organization"></label><button id="saveSetupBtn">利用を開始</button></div></section>
<section id="homeView" class="view hidden"><div class="summary"><div><span>店舗</span><strong id="storeName"></strong></div><div><span>登録商品</span><strong id="productCount">0</strong></div><div><span>在庫数</span><strong id="stockCount">0</strong></div></div><div class="card"><div class="section-head"><h2>保管場所</h2><button id="addLocationBtn" class="secondary">場所を追加</button></div><div id="locationList" class="list"></div></div><div class="card"><div class="section-head"><h2>商品</h2><button id="addProductBtn" class="secondary">商品を追加</button></div><div id="productList" class="list"></div></div></section>
<section id="locationView" class="view hidden"><div class="card"><h2>保管場所の登録</h2><label>名称<input id="locationName"></label><label>親の場所<select id="locationParent"><option value="">なし（大分類）</option></select></label><label>表示番号<input id="locationNumber" type="number" min="0" inputmode="numeric"></label><div class="actions"><button id="saveLocationBtn">保存</button><button data-back class="secondary">戻る</button></div></div></section>
<section id="productView" class="view hidden"><div class="card"><h2>商品の登録</h2><label>商品名<input id="productName"></label><label>規格<input id="productSpec"></label><label>JANコード<input id="productJan" inputmode="numeric"></label><label>保管場所<select id="productLocation"></select></label><label>ケース入数<input id="productCasePack" type="number" min="1" value="1" inputmode="numeric"></label><div class="actions"><button id="saveProductBtn">保存</button><button data-back class="secondary">戻る</button></div></div></section>
<section id="settingsView" class="view hidden"><div class="card"><h2>設定</h2><label>店舗名<input id="settingsStoreName"></label><div class="actions"><button id="saveSettingsBtn">保存</button><button data-back class="secondary">戻る</button></div><p class="note">Ver.2開発版です。Ver.1.26のデータはこの画面から変更しません。</p></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./db.js"></script>
<script src="./inventory-service.js"></script>
<script src="./master-service.js"></script>
<script src="./backup-service.js"></script>
<script src="./migration-service.js"></script>
<script src="./app.js"></script>
</body>
</html>
