<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ver.2 端末操作確認</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.7}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0;background:#fff}label{display:block;padding:8px 0}input{width:22px;height:22px;vertical-align:middle;margin-right:8px}.note{color:#666}.warn{color:#a51d16;font-weight:700}</style></head><body><h1>Ver.2 端末操作確認</h1><p>このページ自体は在庫DBを変更しません。通常アプリで操作し、結果だけチェックしてください。</p><div class="card"><h2>更新管理</h2><label><input type="checkbox">起動後、更新状態が表示される</label><label><input type="checkbox">「更新を確認」で最新版表示になる</label><label><input type="checkbox">新版がある場合だけ「今すぐ更新」が表示される</label></div><div class="card"><h2>キャッシュ復旧</h2><label><input type="checkbox">「アプリキャッシュ削除・再読込」で再起動する</label><label><input type="checkbox">再起動後も商品・在庫・履歴が残る</label><label><input type="checkbox">オフライン再起動できる</label></div><div class="card"><h2>データ管理</h2><p class="warn">全削除はテスト用端末、またはバックアップ取得後だけ実施。</p><label><input type="checkbox">Ver.2バックアップを保存できる</label><label><input type="checkbox">全削除後に初期設定画面へ戻る</label><label><input type="checkbox">デモデータで開始できる</label><label><input type="checkbox">バックアップ復元後に件数・在庫が戻る</label></div><div class="card"><h2>画面機能</h2><label><input type="checkbox">在庫検索・場所フィルターが動く</label><label><input type="checkbox">一括棚卸を保存できる</label><label><input type="checkbox">履歴検索・日付・種類フィルターが動く</label><label><input type="checkbox">表示中の履歴CSVを保存できる</label></div><p class="note">確認票 20260920n。チェック状態は保存しません。</p></body></html>
