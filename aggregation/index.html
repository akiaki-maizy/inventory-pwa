<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在庫集計ツール Ver.2対応 Ver.0.4</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#d1d5db;--accent:#2563eb;--ok:#047857;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);font-size:16px}main{max-width:1250px;margin:auto;padding:18px}h1{font-size:25px;margin:0 0 4px}h2{font-size:19px;margin:0 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}label{display:block;font-size:13px;font-weight:700;margin:4px 0}input,select{width:100%;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}button{border:0;border-radius:10px;background:var(--accent);color:#fff;min-height:44px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}.muted{color:var(--sub);font-size:13px}.notice{background:#eff6ff;color:#1e40af;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}.summary{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:13px;font-weight:700;background:#eef2ff;color:#3730a3}.badge.ok{background:#ecfdf5;color:var(--ok)}.badge.warn{background:#fff7ed;color:var(--warn)}.badge.danger{background:#fef2f2;color:var(--danger)}.scroll{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:850px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;white-space:nowrap}th{position:sticky;top:0;background:#f9fafb;z-index:2;font-size:13px}td.num{text-align:right}tr.alert-expired{background:#fef2f2}tr.alert-soon{background:#fff7ed}.key-note{font-size:11px;color:var(--sub);margin-top:3px}.empty{padding:26px;text-align:center;color:var(--sub)}
</style></head><body><main>
<h1>在庫集計ツール <span class="muted">Ver.2対応 Ver.0.4</span></h1><p class="muted">各店舗の在庫管理PWAから出力したCSVを読み込み、JANを優先して商品を照合します。</p>
<div class="card"><h2>1. 店舗CSVを読み込む</h2><input id="files" type="file" accept=".csv,text/csv" multiple><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="loadBtn">集計する</button><button class="secondary" id="clearBtn">クリア</button></div><div class="notice">商品照合は「JANコード → 商品名＋規格」の順です。JANがなく規格もない商品は、安全のため店舗をまたいで自動統合しません。</div></div>
<div class="card"><h2>2. 表示条件</h2><div class="grid"><div><label>商品検索</label><input id="search" placeholder="商品名・JAN"></div><div><label>表示</label><select id="mode"><option value="all">すべて</option><option value="oneStore">片方の店舗だけにある</option><option value="difference">店舗間の在庫差が大きい</option><option value="expiry">期限が近い</option><option value="expired">期限切れ在庫がある</option><option value="noJan">JAN未登録</option></select></div><div><label>在庫差の基準</label><input id="diffThreshold" type="number" min="1" value="5" inputmode="numeric"></div><div><label>期限警告</label><input id="expiryDays" type="number" min="1" value="30" inputmode="numeric"></div><div><label>仕入先</label><select id="supplierFilter"><option value="">すべて</option></select></div><div><label>JAN状態</label><select id="janFilter"><option value="">すべて</option><option value="yes">JAN登録済み</option><option value="no">JAN未登録</option></select></div></div><label style="margin-top:10px"><input id="hideZero" type="checkbox" style="width:auto;min-height:auto"> 全店舗合計が0の商品を非表示</label></div>
<div class="card"><div class="summary" id="summary"><span class="muted">CSVを読み込んでください。</span></div><div style="margin-top:10px"><button class="secondary" id="exportBtn" disabled>表示結果をCSV出力</button></div></div><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></main>
<script>
let aggregated=[],storeNames=[];
function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}}if(field.length||row.length){row.push(field);rows.push(row)}return rows}
function norm(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase()}
function productKey(x){const jan=String(x.jan||'').replace(/\D/g,'');if(jan)return{key:'JAN:'+jan,method:'JAN'};const ns=norm(x.name),sp=norm(x.spec);if(ns&&sp)return{key:'NS:'+ns+'|'+sp,method:'商品名＋規格'};return{key:'LOCAL:'+norm(x.store)+'|'+String(x.productId||'')+'|'+ns,method:'未照合'}}
function daysUntil(s){if(!s)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(s+'T00:00:00');return Math.ceil((d-t)/86400000)}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function download(filename,text){const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function loadAll(){const files=[...document.getElementById('files').files];if(!files.length)return alert('CSVを選択してください');const raw=[];for(const f of files){const rows=parseCsv((await f.text()).replace(/^\uFEFF/,''));if(!rows.length)continue;const header=rows.shift().map(x=>x.trim()),ix=Object.fromEntries(header.map((x,i)=>[x,i]));if(ix['店舗']===undefined||ix['商品名']===undefined||ix['数量']===undefined){alert(`${f.name} は在庫管理PWAの集計用CSVとして認識できません`);continue}for(const r of rows){if(!r.length)continue;raw.push({store:r[ix['店舗']]||'',productId:ix['商品ID']!==undefined?r[ix['商品ID']]||'':'',jan:ix['JANコード']!==undefined?r[ix['JANコード']]||'':'',name:r[ix['商品名']]||'',spec:ix['規格']!==undefined?r[ix['規格']]||'':'',supplier:ix['仕入先']!==undefined?r[ix['仕入先']]||'':'',unitPrice:ix['参考単価']!==undefined?r[ix['参考単価']]||'':'',location:ix['保管場所']!==undefined?r[ix['保管場所']]||'':'',child:ix['棚・区画']!==undefined?r[ix['棚・区画']]||'':'',qty:Number(r[ix['数量']]||0),expiry:ix['賞味期限']!==undefined?r[ix['賞味期限']]||'':''})}}storeNames=[...new Set(raw.map(x=>x.store).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));if(files.length>1&&storeNames.length<files.length)alert('注意：選択したCSV数より店舗名の種類が少ないため、同じ店舗名のCSVが含まれています。重複読込で数量が二重計上されていないか確認してください。');const map={};for(const x of raw){if(!x.name)continue;const k=productKey(x);if(!map[k.key])map[k.key]={key:k.key,matchMethod:k.method,jan:x.jan||'',name:x.name,spec:x.spec||'',supplier:x.supplier||'',unitPrice:Number(x.unitPrice)||0,stores:{},total:0,expiry:'',locations:{},lots:[]};const p=map[k.key];p.stores[x.store]=(p.stores[x.store]||0)+x.qty;p.total+=x.qty;if(!p.unitPrice&&Number(x.unitPrice))p.unitPrice=Number(x.unitPrice);if(x.expiry&&(!p.expiry||x.expiry<p.expiry))p.expiry=x.expiry;if(x.qty>0)p.lots.push({store:x.store,qty:x.qty,expiry:x.expiry||''});if(x.location){const loc=x.child?`${x.location} / ${x.child}`:x.location;p.locations[x.store]??=new Set();p.locations[x.store].add(loc)}}aggregated=Object.values(map);const suppliers=[...new Set(aggregated.map(x=>x.supplier).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')),sf=document.getElementById('supplierFilter');sf.innerHTML='<option value="">すべて</option>'+suppliers.map(s=>`<option>${s}</option>`).join('');render()}
function lotStats(p,w){let soon=0,expired=0;for(const l of p.lots||[]){const d=daysUntil(l.expiry);if(d===null)continue;if(d<0)expired+=Number(l.qty)||0;else if(d<=w)soon+=Number(l.qty)||0}return{soon,expired}}
function yen(v){return Math.round(Number(v)||0).toLocaleString('ja-JP')+'円'}
function filtered(){const q=norm(document.getElementById('search').value),mode=document.getElementById('mode').value,threshold=Number(document.getElementById('diffThreshold').value||5),expiryDays=Number(document.getElementById('expiryDays').value||30),hideZero=document.getElementById('hideZero').checked,supplier=document.getElementById('supplierFilter').value,janFilter=document.getElementById('janFilter').value;return aggregated.filter(p=>{if(q&&!norm(`${p.name} ${p.spec} ${p.jan} ${p.supplier}`).includes(q))return false;if(hideZero&&p.total===0)return false;if(supplier&&p.supplier!==supplier)return false;if(janFilter==='yes'&&!p.jan)return false;if(janFilter==='no'&&p.jan)return false;const vals=storeNames.map(s=>p.stores[s]||0),present=vals.filter(v=>v>0).length,max=Math.max(...vals,0),min=Math.min(...vals,0),stats=lotStats(p,expiryDays);if(mode==='oneStore'&&present!==1)return false;if(mode==='difference'&&(max-min)<threshold)return false;if(mode==='expiry'&&(stats.soon+stats.expired)<=0)return false;if(mode==='expired'&&stats.expired<=0)return false;if(mode==='noJan'&&p.jan)return false;return true}).sort((a,b)=>a.name.localeCompare(b.name,'ja'))}
function render(){const rows=filtered(),expiryDays=Number(document.getElementById('expiryDays').value||30),head=document.getElementById('thead');head.innerHTML='<tr><th>商品</th><th>規格</th><th>JAN</th>'+storeNames.map(s=>`<th>${s}</th>`).join('')+'<th>合計</th><th>参考単価</th><th>在庫金額</th><th>期限切れ数</th><th>期限警告数</th><th>最短期限</th><th>照合</th></tr>';const body=document.getElementById('tbody');body.innerHTML='';if(!rows.length)body.innerHTML=`<tr><td colspan="${11+storeNames.length}" class="empty">該当商品がありません</td></tr>`;else for(const p of rows){const tr=document.createElement('tr'),d=daysUntil(p.expiry),stats=lotStats(p,expiryDays);if(stats.expired>0)tr.className='alert-expired';else if(stats.soon>0)tr.className='alert-soon';const expiryText=!p.expiry?'未登録':d<0?`${p.expiry}（${Math.abs(d)}日超過）`:d===0?`${p.expiry}（本日）`:`${p.expiry}（あと${d}日）`,stockValue=p.total*(Number(p.unitPrice)||0);tr.innerHTML=`<td><strong>${p.name}</strong>${p.supplier?`<div class="key-note">${p.supplier}</div>`:''}</td><td>${p.spec||''}</td><td>${p.jan||''}</td>`+storeNames.map(s=>`<td class="num">${p.stores[s]||0}</td>`).join('')+`<td class="num"><strong>${p.total}</strong></td><td class="num">${p.unitPrice?yen(p.unitPrice):''}</td><td class="num">${p.unitPrice?yen(stockValue):''}</td><td class="num">${stats.expired||0}</td><td class="num">${stats.soon||0}</td><td>${expiryText}</td><td><span class="badge ${p.matchMethod==='JAN'?'ok':'warn'}">${p.matchMethod}</span></td>`;body.appendChild(tr)}const janCount=aggregated.filter(x=>x.matchMethod==='JAN').length,fallback=aggregated.length-janCount;let totalQty=0,totalValue=0,expiredQty=0,soonQty=0;for(const p of rows){const s=lotStats(p,expiryDays);totalQty+=p.total;totalValue+=p.total*(Number(p.unitPrice)||0);expiredQty+=s.expired;soonQty+=s.soon}document.getElementById('summary').innerHTML=`<span class="badge">${storeNames.length}店舗</span><span class="badge">${aggregated.length}商品</span><span class="badge ok">JAN照合 ${janCount}</span><span class="badge warn">JAN以外/未照合 ${fallback}</span><span class="badge">表示 ${rows.length}</span><span class="badge">在庫数 ${totalQty}</span><span class="badge ok">参考在庫額 ${yen(totalValue)}</span><span class="badge danger">期限切れ ${expiredQty}</span><span class="badge warn">期限警告 ${soonQty}</span>`;document.getElementById('exportBtn').disabled=!aggregated.length}
document.getElementById('loadBtn').onclick=loadAll;document.getElementById('clearBtn').onclick=()=>{document.getElementById('files').value='';aggregated=[];storeNames=[];render()};['search','mode','diffThreshold','expiryDays','hideZero','supplierFilter','janFilter'].forEach(id=>{const el=document.getElementById(id);el.addEventListener(id==='search'?'input':'change',render)});document.getElementById('exportBtn').onclick=()=>{const rows=filtered();if(!rows.length)return alert('出力する商品がありません');const days=Number(document.getElementById('expiryDays').value||30),hdr=['商品名','規格','JANコード','仕入先',...storeNames,'合計','参考単価','在庫金額','期限切れ数','期限警告数','最短賞味期限','照合方法'],data=[hdr];rows.forEach(p=>{const s=lotStats(p,days);data.push([p.name,p.spec||'',p.jan||'',p.supplier||'',...storeNames.map(st=>p.stores[st]||0),p.total,p.unitPrice||'',p.total*(Number(p.unitPrice)||0),s.expired,s.soon,p.expiry||'',p.matchMethod])});const csv='\uFEFF'+data.map(r=>r.map(csvEscape).join(',')).join('\r\n'),d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');download(`全店舗在庫集計_${y}-${m}-${day}.csv`,csv)};render();
</script></body></html>
